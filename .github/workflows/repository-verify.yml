name: Repository Verify

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: false # CI paused by owner
    name: Static repository contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"
      - name: Verify repository governance and source-validation routing
        run: python tools/verify_repository.py

      - name: Exercise advisory preflight regression cases
        run: python -m unittest discover -s tools/tests -p "test_*.py"

      - name: Write exact-SHA proof summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Repository Verify"
            echo
            echo "- SHA: \`$GITHUB_SHA\`"
            echo "- Ref: \`$GITHUB_REF\`"
            echo "- Event: \`$GITHUB_EVENT_NAME\`"
            echo
            echo "This summary identifies the exact source revision evaluated by this workflow run. A completed successful run is source/contract evidence only; it is not TARGET_WINDOWS native acceptance."
          } >> "$GITHUB_STEP_SUMMARY"
