name: MiLMMT Repository Contract

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    if: false # CI paused by owner
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"
      - run: python tools/translation_quality/validate_canonical_milmmt_repo.py
      - name: Validate translation quality corpus
        run: >-
          python tools/translation_quality/evaluate_translation_quality.py
          validate-corpus
          --corpus tools/translation_quality/corpus/translation_quality_v1.json
      - name: Validate held-out translation benchmark
        run: >-
          python tools/translation_quality/evaluate_translation_quality.py
          validate-corpus
          --corpus tools/translation_quality/heldout/translation_quality_heldout_v1.json
      - name: Self-test translation quality evaluator
        run: python tools/translation_quality/self_test.py
      - name: Compile canonical Python owners
        run: >-
          python -m py_compile
          EngineData/Backend/LocalWorker/WorkerRuntime/realtime_local_worker.py
          EngineData/Backend/LocalWorker/WorkerRuntime/realtime_local_worker_base.py
          EngineData/Backend/LocalWorker/WorkerRuntime/milmmt_translation_provider.py
          EngineData/Backend/LocalWorker/WorkerRuntime/worker_runtime_common.py
          EngineData/Backend/LocalWorker/WorkerRuntime/worker_io_runtime.py
          EngineData/Backend/LocalWorker/WorkerRuntime/prepare_model_assets.py
          EngineData/Backend/LocalWorker/WorkerRuntime/prepare_model_assets_core.py

      - name: Write exact-SHA proof summary
        if: always()
        shell: bash
        run: |
          {
            echo "## MiLMMT Repository Contract"
            echo
            echo "- SHA: \`$GITHUB_SHA\`"
            echo "- Ref: \`$GITHUB_REF\`"
            echo "- Event: \`$GITHUB_EVENT_NAME\`"
            echo
            echo "This summary identifies the exact source revision evaluated by this workflow run. A completed successful run is source/contract evidence only; it is not TARGET_WINDOWS native acceptance."
          } >> "$GITHUB_STEP_SUMMARY"
