name: Quality Readiness Contract

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    if: false # CI paused by owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"
      - name: Self-test aggregate quality readiness
        run: python tools/quality_readiness/self_test.py
      - name: Verify domain comparison contracts remain available
        shell: python
        run: |
          from pathlib import Path

          required = {
              "tools/translation_quality/evaluate_translation_quality.py": (
                  "translateit.translation_quality.comparison.v1",
                  "promotion_safe_on_declared_critical_invariants",
              ),
              "tools/asr_quality/evaluate_asr_quality.py": (
                  "translateit.asr_quality.comparison.v1",
                  "promotion_safe_on_declared_critical_invariants",
              ),
              "tools/tts_quality/evaluate_tts_quality.py": (
                  "translateit.tts_quality.comparison.v1",
                  "promotion_safe_on_declared_critical_invariants",
              ),
          }
          missing = []
          for path, markers in required.items():
              source = Path(path).read_text(encoding="utf-8")
              missing.extend(f"{path}:{marker}" for marker in markers if marker not in source)
          if missing:
              raise SystemExit(f"quality readiness domain contract missing: {missing}")

      - name: Write exact-SHA proof summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Quality Readiness Contract"
            echo
            echo "- SHA: \`$GITHUB_SHA\`"
            echo "- Ref: \`$GITHUB_REF\`"
            echo "- Event: \`$GITHUB_EVENT_NAME\`"
            echo
            echo "This summary identifies the exact source revision evaluated by this workflow run. A completed successful run is source/contract evidence only; it is not TARGET_WINDOWS native acceptance."
          } >> "$GITHUB_STEP_SUMMARY"
