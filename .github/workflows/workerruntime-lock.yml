name: WorkerRuntime Lock Consistency

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lock:
    if: false # CI paused by owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: EngineData/Backend/LocalWorker/WorkerRuntime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - run: uv lock --check
      - run: git diff --exit-code -- pyproject.toml uv.lock

      - name: Write exact-SHA proof summary
        if: always()
        shell: bash
        run: |
          {
            echo "## WorkerRuntime Lock Consistency"
            echo
            echo "- SHA: \`$GITHUB_SHA\`"
            echo "- Ref: \`$GITHUB_REF\`"
            echo "- Event: \`$GITHUB_EVENT_NAME\`"
            echo
            echo "This summary identifies the exact source revision evaluated by this workflow run. A completed successful run is source/contract evidence only; it is not TARGET_WINDOWS native acceptance."
          } >> "$GITHUB_STEP_SUMMARY"
