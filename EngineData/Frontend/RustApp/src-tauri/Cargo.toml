[package]
name = "translateit"
version = "0.1.0"
description = "TranslateIT Rust/Tauri conversion shell"
authors = ["Halo Karya Media"]
edition = "2021"
rust-version = "1.99.1"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
cpal = "0.18.2"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"] }
rubato = "=5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "=0.11.1"
sysinfo = "0.39.6"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-updater = "=2.14.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
