[project]
name = "translateit-worker-runtime"
version = "0.0.0"
description = "Internal Python runtime for the TranslateIT desktop application."
requires-python = ">=3.12,<3.13"
dependencies = [
    "cn2an",
    "ctranslate2==4.8.3",
    "fast-langdetect>=0.3.1",
    "faster-whisper>=1.0.0",
    "ffmpeg-python",
    "g2p-en==2.1.0",
    "jieba",
    "jieba-fast",
    "librosa==0.10.2",
    "matplotlib",
    "numba",
    "numpy<2.0",
    "pandas",
    "peft<0.18.0",
    "psutil",
    "pypinyin",
    "pytorch-lightning>=2.4",
    "PyYAML",
    "rotary-embedding-torch",
    "sacremoses",
    "scipy",
    "sentencepiece",
    "soundfile",
    "split-lang",
    "tensorboard",
    "torch==2.14.1",
    "torchaudio==2.11.0",
    "torchmetrics<=1.5",
    "tqdm",
    "transformers==4.57.6",
    "wordsegment",
    "x-transformers",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "huggingface-hub",
    "pytest",
    "ruff",
]

[tool.uv]
package = false
required-version = ">=0.13.5"
exclude-dependencies = [
    { package = { name = "g2p-en", version = "2.1.0" }, dependencies = ["distance"] },
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
